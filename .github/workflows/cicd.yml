name: CI/CD frontend-app cicd test with deploy server

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-api-image
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-api-image:${{ github.run_number }}
  VITE_API_URL: https://api.194.lebondeveloppeur.net

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm run test

  build-and-push:

    needs: test

    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        build-args: |
          VITE_API_URL=${{ env.VITE_API_URL }}
        tags: |
          ${{ env.IMAGE_NAME }}
          ${{ env.IMAGE_REPO }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:

    needs: build-and-push

    runs-on: ubuntu-latest

    environment: production

    steps:

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          set -e

          # Pull the new image first: if it fails, the old container stays up
          sudo docker pull ${{ env.IMAGE_NAME }}

          # Remove the old container if it exists
          sudo docker rm -f frontend-app || true

          sudo docker run -d \
            -p 3002:80 \
            --name frontend-app \
            --restart always \
            ${{ env.IMAGE_NAME }}

          # Health check: wait up to ~30s for the app to answer
          for i in $(seq 1 10); do
            if curl -fsS http://localhost:3002 > /dev/null; then
              echo "Health check OK"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "Health check FAILED"
              sudo docker logs --tail 50 frontend-app
              exit 1
            fi
            sleep 3
          done

          # Clean up unused images
          sudo docker image prune -f

          # Show running containers
          sudo docker ps