name: CI/CD frontend-app cicd test with deploy server

on:
  push:
    branches: [ "main" ]
    

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frontend-api-image:${{ github.run_number }}  
  
jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test  